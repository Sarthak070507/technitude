<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Hack the Hunt — Join the Crew</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="game-bg register-page">

<video class="bg-video" autoplay muted loop playsinline>
    <source src="images/registerbackground.mp4" type="video/mp4">
</video>

<main class="card reveal">

    <div class="flag">
        <img src="images/luffyskull.png" alt="Luffy Skull">
    </div>

    <p class="eyebrow">WELCOME ABOARD</p>

    <h1>NAME YOUR CREW</h1>

    <p class="subtle">Every legend needs a crew name.</p>

    <input
        id="teamName"
        maxlength="100"
        placeholder="Enter your crew name"
        autocomplete="off"
    >

    <button id="enter" class="gold-btn">
        ⚓ SET SAIL
    </button>

    <p id="msg" class="message"></p>

</main>

<script src="js/register.js"></script>

</body>
</html>
